[workspace]
resolver = "2"
members = ["crates/vimora-core", "crates/vimora-ui", "crates/vimora-update", "crates/vimora-tray", "apps/vimora-server", "apps/vimora-client"]

[workspace.package]
version = "0.3.18"
edition = "2021"
license = "MIT"
authors = ["VEYMAY"]
repository = "https://github.com/veymay/vimora"

[workspace.dependencies]
vimora-core = { path = "crates/vimora-core" }
vimora-ui = { path = "crates/vimora-ui" }
vimora-update = { path = "crates/vimora-update" }
vimora-tray = { path = "crates/vimora-tray" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
dirs = "5"
hostname = "0.4"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.32"
x11rb = { version = "0.13", features = ["xtest"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_System_StationsAndDesktops",
  "Win32_Security",
] }

[profile.release]
# Fast to build: all cores generate code in parallel, no link-time optimisation.
# (The programs are I/O- and GPU-bound; LTO/codegen-units=1 only made builds several times slower.)
opt-level = 3
lto = false
codegen-units = 16
strip = true

# Fast image encode/decode even in debug builds
[profile.dev.package."*"]
opt-level = 2
