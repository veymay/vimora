[package]
name = "vimora-student"
description = "Vimora student agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vimora-student"
path = "src/main.rs"

[dependencies]
vimora-core.workspace = true
vimora-ui.workspace = true
vimora-update.workspace = true
vimora-tray.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { workspace = true, features = ["wgpu"] }
egui.workspace = true
image.workspace = true
arboard = { version = "3", default-features = false, features = ["image-data"] }
dirs.workspace = true
hostname.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Ubuntu/Debian package: `cargo deb -p vimora-student` → vimora-student_<v>_amd64.deb
[package.metadata.deb]
name = "vimora-student"
maintainer = "VEYMAY"
copyright = "2026, VEYMAY"
extended-description = "Vimora student program and its privileged service. Installs with no questions; the teacher adds the computer from the teacher program."
section = "education"
priority = "optional"
revision = ""
depends = "$auto, libgl1, libxkbcommon0, libx11-6, libxcursor1, libxrandr2, libxi6"
maintainer-scripts = "../../installer/linux/deb/student/"
assets = [
    ["target/release/vimora-student", "opt/vimora/bin/", "755"],
    ["../../installer/linux/deb/vimora-student.desktop", "etc/xdg/autostart/vimora-student.desktop", "644"],
]
